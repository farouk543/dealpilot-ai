[project]
name = "interior-render"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "torch>=2.3",
    "diffusers>=0.30",
    "transformers>=4.44",
    "accelerate>=0.33",
    "safetensors>=0.4",
    "pillow>=10.0",
    "dealpilot-shared",
]

[tool.uv.sources]
dealpilot-shared = { workspace = true }
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
